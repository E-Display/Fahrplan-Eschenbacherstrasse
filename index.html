<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abfahrtsmonitor Rothenburg, Eschenbachstrasse</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  iframe {
    border: none;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .fallback {
    display: none;
    font-family: sans-serif;
    color: #fff;
    text-align: center;
    padding-top: 40vh;
  }
  .fallback a {
    color: #4fa3ff;
    font-size: 1.4em;
  }
</style>
</head>
<body>

  <iframe
    id="monitorFrame"
    src="https://free.oevplus.ch/monitor/?viewType=singleView&layout=1&showClock=true&showPerron=true&stationGroup1Title=Rothenburg%2C%20Eschenbachstrasse&station_1_id=85%3A77238&station_1_name=Rothenburg%2C%20Eschenbachstrasse&station_1_quantity=5&station_1_group=1"
    allowfullscreen
    onerror="showFallback()">
  </iframe>

  <div class="fallback" id="fallback">
    <p>Die Seite kann nicht eingebettet werden.</p>
    <a href="https://free.oevplus.ch/monitor/?viewType=singleView&layout=1&showClock=true&showPerron=true&stationGroup1Title=Rothenburg%2C%20Eschenbachstrasse&station_1_id=85%3A77238&station_1_name=Rothenburg%2C%20Eschenbachstrasse&station_1_quantity=5&station_1_group=1" target="_blank">
      Monitor direkt öffnen
    </a>
  </div>

  <script>
    // Falls das iframe aus Sicherheitsgründen (X-Frame-Options / CSP) leer bleibt,
    // erkennen wir das nach kurzer Zeit nicht zuverlässig automatisch (Cross-Origin),
    // daher als manuelle Absicherung: Klick auf den Fallback-Link, falls nichts sichtbar ist.
    function showFallback() {
      document.getElementById('fallback').style.display = 'block';
    }
  </script>

</body>
</html>
